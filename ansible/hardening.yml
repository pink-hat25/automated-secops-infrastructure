---
- name: SecOps Baseline Hardening for AlmaLinux 9
  hosts: secops_nodes
  become: true

  tasks:
    - name: Update all OS packages to latest version
      ansible.builtin.dnf:
        name: "*"
        state: latest

    - name: Install EPEL release repository
      ansible.builtin.dnf:
        name: epel-release
        state: present

    - name: Install essential security packages
      ansible.builtin.dnf:
        name:
          - firewalld
          - fail2ban
          - policycoreutils-python-utils
        state: present

    - name: Ensure Firewalld service is started and enabled
      ansible.builtin.systemd:
        name: firewalld
        state: started
        enabled: true

    - name: Allow SSH service through Firewalld
      ansible.posix.firewalld:
        service: ssh
        permanent: true
        state: enabled
        immediate: true

    - name: Ensure Fail2ban service is started and enabled
      ansible.builtin.systemd:
        name: fail2ban
        state: started
        enabled: true

    - name: Hardening SSH - Disable Root Login
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PermitRootLogin'
        line: 'PermitRootLogin no'
        validate: '/usr/sbin/sshd -t -f %s'
      notify: Restart sshd

    - name: Hardening SSH - Disable Password Authentication
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PasswordAuthentication'
        line: 'PasswordAuthentication no'
        validate: '/usr/sbin/sshd -t -f %s'
      notify: Restart sshd

    - name: Ensure SELinux is set to Enforcing mode
      ansible.posix.selinux:
        policy: targeted
        state: enforcing

  handlers:
    - name: Restart sshd
      ansible.builtin.systemd:
        name: sshd
        state: restarted
